
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nail Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fffaf8, #fff, #fff5ef);
            font-family: "Poppins", sans-serif;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border: 1px solid #f0dfd4;
            border-radius: 22px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .auth-logo {
            text-align: center;
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .auth-logo span {
            color: #b8860b;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .auth-card h2 {
            text-align: center;
            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
            color: #333;
            margin: 0 0 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #444;
            margin-bottom: 7px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #e5d8d0;
            border-radius: 8px;
            outline: none;
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .form-group input:focus {
            border-color: #c89b3c;
            box-shadow: 0 0 0 3px rgba(200, 155, 60, 0.10);
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            margin-top: 8px;
            background: linear-gradient(135deg, #c89b3c, #b8860b);
            color: white;
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.20);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .auth-message {
            min-height: 20px;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            color: #c0392b;
            overflow-wrap: anywhere;
        }

        .register-text {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 22px;
        }

        .register-text a {
            color: #b8860b;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #999;
            text-decoration: none;
            font-size: 11px;
        }

        @media (max-width: 500px) {
            .auth-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">
                💅 <span>Nail Studio</span>
            </div>

            <p class="auth-subtitle">
                Luxury nails designed for you
            </p>

            <h2>Welcome Back</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>
            </form>

            <div
                id="loginMessage"
                class="auth-message"
                role="status"
                aria-live="polite">
            </div>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            const message = document.getElementById("loginMessage");

            const submitButton =
                loginForm.querySelector('button[type="submit"]');

            const API_URL =
                "https://nail-studio-backend-k604.onrender.com/api/users";

            function showMessage(text, color) {
                message.textContent = text;
                message.style.color = color;
            }

            loginForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                const email =
                    document.getElementById("loginEmail").value.trim();

                const password =
                    document.getElementById("loginPassword").value;

                message.textContent = "";
                submitButton.disabled = true;
                submitButton.textContent = "Logging in...";

                // Clear previous client-side login information.
                localStorage.removeItem("nailStudioLoggedIn");
                localStorage.removeItem("nailStudioUserName");
                localStorage.removeItem("nailStudioUserEmail");

                try {
                    // Step 1: Authenticate customer.
                    const response = await fetch(API_URL + "/login", {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    const responseText = await response.text();
                    let result = {};

                    try {
                        result = responseText
                            ? JSON.parse(responseText)
                            : {};
                    } catch {
                        result = {};
                    }

                    if (!response.ok) {
                        throw new Error(
                            result.message ||
                            "Invalid email or password."
                        );
                    }

                    // Step 2: Verify the server-side session.
                    const sessionResponse = await fetch(
                        API_URL + "/session",
                        {
                            method: "GET",
                            credentials: "include",
                            headers: {
                                "Accept": "application/json"
                            }
                        }
                    );

                    if (!sessionResponse.ok) {
                        throw new Error(
                            "Login was accepted, but the server session could not be verified. Please try again."
                        );
                    }

                    const sessionData =
                        await sessionResponse.json();

                    if (
                        sessionData.loggedIn !== true ||
                        !sessionData.email
                    ) {
                        throw new Error(
                            "Customer session is not active. Please log in again."
                        );
                    }

                    // Step 3: Save client-side display information
                    // only after the server session is verified.
                    localStorage.setItem(
                        "nailStudioLoggedIn",
                        "true"
                    );

                    localStorage.setItem(
                        "nailStudioUserName",
                        sessionData.name || result.name || ""
                    );

                    localStorage.setItem(
                        "nailStudioUserEmail",
                        sessionData.email
                    );

                    showMessage(
                        "Login successful. Redirecting...",
                        "#218838"
                    );

                    setTimeout(function () {
                        window.location.href = "index.html";
                    }, 700);

                } catch (error) {
                    console.error("Login/session error:", error);

                    showMessage(
                        error.message === "Failed to fetch"
                            ? "Cannot connect to the server. Please check your connection and try again."
                            : error.message,
                        "#c0392b"
                    );

                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = "Login";
                }
            });
        });
    </script>
</body>
</html>
