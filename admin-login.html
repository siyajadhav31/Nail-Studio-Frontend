<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nail Studio</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>


<body>


<section class="auth-page">

    <div class="auth-container">


        <div class="auth-logo">

            💅 Nail Studio

        </div>


        <form
            id="adminLoginForm"
            class="auth-form">


            <h1>
                Admin Login
            </h1>


            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                required>


            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required>


            <button
                type="submit"
                class="auth-btn">

                Login as Admin

            </button>


            <p
                id="adminMessage"
                style="
                    text-align:center;
                    margin-top:15px;
                ">
            </p>


        </form>


        <a
            href="welcome.html"
            class="back-home">

            ← Back to Website

        </a>


    </div>

</section>



<script>


document
    .getElementById("adminLoginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "adminEmail"
                ).value;


            const password =
                document.getElementById(
                    "adminPassword"
                ).value;


            const message =
                document.getElementById(
                    "adminMessage"
                );


            try {


                const response =
                    await fetch(
                        "http://127.0.0.1:8080/api/admin/login",
                        {

                            method: "POST",

                            credentials:
                                "include",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }
                    );


                const result =
                    await response.text();


                if (
                    result ===
                    "Admin login successful"
                ) {


                    message.style.color =
                        "green";


                    message.textContent =
                        "Admin login successful!";


                    setTimeout(
                        function() {

                            window.location.href =
                                "admin-bookings.html";

                        },
                        500
                    );


                }

                else {


                    message.style.color =
                        "red";


                    message.textContent =
                        result;

                }


            }


            catch (error) {


                console.error(
                    "Admin login error:",
                    error
                );


                message.style.color =
                    "red";


                message.textContent =
                    "Unable to connect to server.";

            }

        }
    );


</script>


</body>

</html>
