<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nail Studio</title>


    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">


    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>


<body class="admin-login-page">


    <!-- ==========================================
         ADMIN LOGIN
    =========================================== -->

    <section class="admin-login-section">

        <div class="admin-login-card">


            <!-- LOGO -->

            <div class="admin-login-logo">
                💅
            </div>


            <h1>
                Nail Studio
            </h1>


            <p class="admin-login-subtitle">
                Admin Login
            </p>


            <p class="admin-login-description">
                Login to manage customer bookings.
            </p>


            <!-- ==========================================
                 LOGIN FORM
            =========================================== -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- LOGIN MESSAGE -->

                <div
                    id="loginMessage"
                    class="admin-login-message">
                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="adminLoginBtn"
                    class="admin-login-btn">

                    Login as Admin

                </button>


            </form>


            <!-- BACK TO WEBSITE -->

            <a
                href="index.html"
                class="back-home-link">

                ← Back to Website

            </a>


        </div>

    </section>



    <!-- ==========================================
         JAVASCRIPT
    ============================================ -->

    <script>

        /* ==========================================
           LIVE SPRING BOOT BACKEND
        ========================================== */

        const API_BASE_URL =
            "https://nail-studio-backend-k604.onrender.com";


        /* ==========================================
           GET HTML ELEMENTS
        ========================================== */

        const adminLoginForm =
            document.getElementById(
                "adminLoginForm"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const adminLoginBtn =
            document.getElementById(
                "adminLoginBtn"
            );


        /* ==========================================
           ADMIN LOGIN
        ========================================== */

        adminLoginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* ==========================================
                   GET EMAIL
                ========================================== */

                const email =
                    document
                        .getElementById(
                            "adminEmail"
                        )
                        .value
                        .trim();


                /* ==========================================
                   GET PASSWORD
                ========================================== */

                const password =
                    document
                        .getElementById(
                            "adminPassword"
                        )
                        .value;


                /* ==========================================
                   VALIDATION
                ========================================== */

                if (!email || !password) {

                    loginMessage.textContent =
                        "Please enter email and password.";

                    loginMessage.className =
                        "admin-login-message error";

                    return;

                }


                /* ==========================================
                   BUTTON LOADING
                ========================================== */

                adminLoginBtn.disabled =
                    true;

                adminLoginBtn.textContent =
                    "Logging in...";


                loginMessage.textContent =
                    "";

                loginMessage.className =
                    "admin-login-message";


                /* ==========================================
                   SEND LOGIN REQUEST
                ========================================== */

                try {

                    console.log(
                        "================================="
                    );

                    console.log(
                        "Sending admin login request..."
                    );

                    console.log(
                        "Backend:",
                        API_BASE_URL
                    );

                    console.log(
                        "Email:",
                        email
                    );

                    console.log(
                        "================================="
                    );


                    const response =
                        await fetch(
                            API_BASE_URL +
                            "/api/admin/login",
                            {

                                method: "POST",

                                credentials: "include",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "text/plain"

                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            }
                        );


                    /* ==========================================
                       RESPONSE STATUS
                    ========================================== */

                    console.log(
                        "Admin login status:",
                        response.status
                    );


                    /* ==========================================
                       READ RESPONSE
                    ========================================== */

                    const result =
                        await response.text();


                    console.log(
                        "Admin Login Response:",
                        result
                    );


                    /* ==========================================
                       LOGIN SUCCESS
                    ========================================== */

                    if (
                        response.ok &&
                        result.trim() ===
                        "Admin login successful"
                    ) {

                        console.log(
                            "Admin login successful."
                        );


                        /* ==========================================
                           SAVE ADMIN LOGIN
                        ========================================== */

                        localStorage.setItem(
                            "adminLoggedIn",
                            "true"
                        );


                        localStorage.setItem(
                            "adminEmail",
                            email
                        );


                        /* ==========================================
                           SUCCESS MESSAGE
                        ========================================== */

                        loginMessage.textContent =
                            "Login successful! Redirecting...";


                        loginMessage.className =
                            "admin-login-message success";


                        /* ==========================================
                           REDIRECT
                        ========================================== */

                        setTimeout(
                            function () {

                                window.location.href =
                                    "admin-bookings.html";

                            },
                            700
                        );


                        return;

                    }


                    /* ==========================================
                       LOGIN FAILED
                    ========================================== */

                    loginMessage.textContent =
                        result ||
                        "Invalid admin email or password.";


                    loginMessage.className =
                        "admin-login-message error";


                    adminLoginBtn.disabled =
                        false;


                    adminLoginBtn.textContent =
                        "Login as Admin";

                }


                /* ==========================================
                   CONNECTION ERROR
                ========================================== */

                catch (error) {

                    console.error(
                        "Admin Login Error:",
                        error
                    );


                    loginMessage.textContent =
                        "Unable to connect to server. Please try again.";


                    loginMessage.className =
                        "admin-login-message error";


                    adminLoginBtn.disabled =
                        false;


                    adminLoginBtn.textContent =
                        "Login as Admin";

                }

            }
        );

    </script>


</body>

</html>
