<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nail Studio</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>


<body class="admin-login-page">


    <!-- ==========================================
         ADMIN LOGIN
    =========================================== -->

    <section class="admin-login-section">

        <div class="admin-login-card">


            <!-- LOGO -->

            <div class="admin-login-logo">

                💅

            </div>


            <h1>
                Nail Studio
            </h1>


            <p class="admin-login-subtitle">
                Admin Login
            </p>


            <p class="admin-login-description">
                Login to manage customer bookings.
            </p>


            <!-- ==========================================
                 LOGIN FORM
            =========================================== -->

            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required>

                </div>


                <!-- ERROR MESSAGE -->

                <div
                    id="loginMessage"
                    class="admin-login-message">
                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="adminLoginBtn"
                    class="admin-login-btn">

                    Login as Admin

                </button>


            </form>


            <!-- BACK TO WEBSITE -->

            <a
                href="index.html"
                class="back-home-link">

                ← Back to Website

            </a>


        </div>

    </section>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script>

        const API_BASE_URL =
            "http://localhost:8080";


        const adminLoginForm =
            document.getElementById(
                "adminLoginForm"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const adminLoginBtn =
            document.getElementById(
                "adminLoginBtn"
            );


        /* ==========================================
           ADMIN LOGIN
        =========================================== */

        adminLoginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById(
                            "adminEmail"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "adminPassword"
                        )
                        .value;


                if (!email || !password) {

                    loginMessage.textContent =
                        "Please enter email and password.";

                    loginMessage.className =
                        "admin-login-message error";

                    return;

                }


                adminLoginBtn.disabled = true;

                adminLoginBtn.textContent =
                    "Logging in...";


                loginMessage.textContent =
                    "";


                try {

                    const response =
                        await fetch(
                            API_BASE_URL +
                            "/api/admin/login",
                            {

                                method: "POST",

                                credentials: "include",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        email: email,

                                        password: password

                                    })

                            }
                        );


                    const result =
                        await response.text();


                    console.log(
                        "Admin Login Response:",
                        result
                    );


                    if (
                        response.ok &&
                        result.trim() ===
                        "Admin login successful"
                    ) {


                        /*
                         * Store admin information
                         */

                        localStorage.setItem(
                            "adminLoggedIn",
                            "true"
                        );


                        localStorage.setItem(
                            "adminEmail",
                            email
                        );


                        loginMessage.textContent =
                            "Login successful! Redirecting...";


                        loginMessage.className =
                            "admin-login-message success";


                        /*
                         * Redirect to admin dashboard
                         */

                        setTimeout(
                            function () {

                                window.location.href =
                                    "admin-bookings.html";

                            },
                            500
                        );


                    } else {


                        loginMessage.textContent =
                            result ||
                            "Invalid admin email or password.";


                        loginMessage.className =
                            "admin-login-message error";


                        adminLoginBtn.disabled =
                            false;


                        adminLoginBtn.textContent =
                            "Login as Admin";

                    }

                }

                catch (error) {

                    console.error(
                        "Admin Login Error:",
                        error
                    );


                    loginMessage.textContent =
                        "Unable to connect to server. Please make sure Spring Boot is running.";


                    loginMessage.className =
                        "admin-login-message error";


                    adminLoginBtn.disabled =
                        false;


                    adminLoginBtn.textContent =
                        "Login as Admin";

                }

            }
        );

    </script>


</body>

</html>
