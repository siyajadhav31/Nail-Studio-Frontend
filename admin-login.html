<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Nail Studio</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>


<body>


<section class="auth-page">

    <div class="auth-container">


        <!-- LOGO -->

        <div class="auth-logo">

            💅 Nail Studio

        </div>


        <!-- ADMIN LOGIN FORM -->

        <form
            id="adminLoginForm"
            class="auth-form">


            <h1>
                Admin Login
            </h1>


            <!-- EMAIL -->

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                required>


            <!-- PASSWORD -->

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-btn">

                Login as Admin

            </button>


            <!-- MESSAGE -->

            <p
                id="adminMessage"
                style="
                    text-align: center;
                    margin-top: 15px;
                ">
            </p>


        </form>


        <!-- BACK TO WEBSITE -->

        <a
            href="welcome.html"
            class="back-home">

            ← Back to Website

        </a>


    </div>

</section>



<script>


document
    .getElementById("adminLoginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /* ===============================
               GET FORM VALUES
            =============================== */

            const email =
                document.getElementById(
                    "adminEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "adminPassword"
                ).value;


            const message =
                document.getElementById(
                    "adminMessage"
                );


            /* ===============================
               RESET MESSAGE
            =============================== */

            message.style.color = "";
            message.textContent = "Logging in...";


            try {


                /* ===============================
                   LOCAL SPRING BOOT BACKEND
                =============================== */

                const response =
                    await fetch(
                        "http://localhost:8080/api/admin/login",
                        {

                            method: "POST",

                            credentials:
                                "include",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email: email,

                                    password: password

                                })

                        }
                    );


                /* ===============================
                   GET SERVER RESPONSE
                =============================== */

                const result =
                    await response.text();


                console.log(
                    "Admin login response:",
                    result
                );


                /* ===============================
                   LOGIN SUCCESS
                =============================== */

                if (
                    response.ok &&
                    result ===
                    "Admin login successful"
                ) {


                    message.style.color =
                        "green";


                    message.textContent =
                        "Admin login successful!";


                    /* ===============================
                       REDIRECT TO ADMIN BOOKINGS
                    =============================== */

                    setTimeout(
                        function() {

                            window.location.href =
                                "admin-bookings.html";

                        },
                        500
                    );


                }


                /* ===============================
                   LOGIN FAILED
                =============================== */

                else {


                    message.style.color =
                        "red";


                    message.textContent =
                        result ||
                        "Invalid admin email or password.";

                }


            }


            /* ===============================
               SERVER CONNECTION ERROR
            =============================== */

            catch (error) {


                console.error(
                    "Admin login error:",
                    error
                );


                message.style.color =
                    "red";


                message.textContent =
                    "Unable to connect to server.";

            }

        }
    );


</script>


</body>

</html>
