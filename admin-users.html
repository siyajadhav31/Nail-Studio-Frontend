
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users | Nail Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fffaf8;
            color: #49393e;
            font-family: 'Poppins', sans-serif;
        }

        /* ADMIN NAVBAR */
        .admin-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 16px 5%;
            background: #fff;
            box-shadow: 0 2px 12px rgba(80, 50, 30, 0.08);
        }

        .admin-logo {
            color: #49393e;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
        }

        .admin-nav-right {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-nav-link {
            color: #49393e;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
        }

        .admin-nav-link:hover,
        .admin-nav-link.active {
            background: #c89b3c;
            color: white;
        }

        .logout-btn {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            background: #49393e;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #302329;
        }

        /* PAGE */
        .admin-bookings {
            padding: 45px 20px;
            min-height: 80vh;
        }

        .admin-container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .admin-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-title span {
            display: inline-block;
            color: #b8860b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .admin-title h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 44px;
            font-weight: 700;
        }

        .admin-title p {
            color: #8c7770;
            font-size: 14px;
        }

        /* SEARCH AND REFRESH */
        .users-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .registered-count {
            font-size: 15px;
            font-weight: 500;
            color: #555;
        }

        .registered-count span {
            color: #b8860b;
            font-weight: 600;
        }

        .user-search {
            position: relative;
            width: 280px;
        }

        .user-search input {
            width: 100%;
            padding: 11px 15px 11px 40px;
            border: 1px solid #e5d4cc;
            border-radius: 12px;
            background: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.3s ease;
        }

        .user-search input:focus {
            border-color: #c89b3c;
            box-shadow: 0 0 0 3px rgba(200, 155, 60, 0.10);
        }

        .user-search span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .refresh-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #c89b3c, #b8860b);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(184, 134, 11, 0.25);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* TABLE */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border: 1px solid #eadfd8;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(80, 50, 30, 0.07);
        }

        .users-table-wrapper {
            overflow-x: auto;
            width: 100%;
        }

        #usersTable {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            display: none;
        }

        #usersTable thead {
            background: #49393e;
        }

        #usersTable th {
            padding: 15px;
            color: white;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        #usersTable td {
            padding: 16px 15px;
            border-bottom: 1px solid #eee5e0;
            vertical-align: middle;
            font-size: 13px;
        }

        #usersTable tbody tr:hover {
            background: #fffaf5;
        }

        #usersTable tbody tr:last-child td {
            border-bottom: none;
        }

        .user-name {
            font-weight: 500;
            color: #333;
        }

        .user-email {
            color: #666;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .user-id {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 30px;
            padding: 0 8px;
            border-radius: 9px;
            background: #fff4ef;
            color: #b8860b;
            font-size: 12px;
            font-weight: 600;
        }

        .user-action {
            white-space: nowrap;
        }

        .delete-btn {
            border: none;
            border-radius: 7px;
            padding: 8px 11px;
            background: #dc3545;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b92332;
        }

        .delete-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .user-date {
            color: #666;
            font-size: 12px;
            white-space: nowrap;
        }

        /* MESSAGES */
        .loading,
        .empty-message {
            padding: 35px 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .user-empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .history-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #a47712;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .history-link:hover {
            text-decoration: underline;
        }

        .admin-footer {
            padding: 20px;
            text-align: center;
            color: #8c7770;
            font-size: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .users-page-header {
                align-items: stretch;
            }

            .user-search {
                width: 100%;
            }

            .refresh-btn {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .admin-navbar {
                align-items: flex-start;
            }

            .admin-nav-right {
                width: 100%;
            }

            .admin-nav-link {
                padding: 9px;
            }

            .users-page-header {
                flex-direction: column;
            }

            .registered-count {
                text-align: left;
            }

            .admin-bookings {
                padding: 30px 12px;
            }

            .admin-title h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav class="admin-navbar">

            <a href="admin-bookings.html" class="admin-logo">
                💅 Nail Studio
            </a>

            <div class="admin-nav-right">

                <a href="admin-bookings.html" class="admin-nav-link">
                    Customer Bookings
                </a>

                <a href="admin-users.html" class="admin-nav-link active">
                    Registered Users
                </a>

                <button type="button" id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </div>
        </nav>
    </header>

    <!-- REGISTERED USERS -->
    <section class="admin-bookings">
        <div class="admin-container">

            <div class="admin-title">
                <span>✨ Nail Studio Administration</span>
                <h1>Registered Users</h1>
                <p>Manage all registered customers from one place.</p>
            </div>

            <div class="users-page-header">

                <div class="registered-count" id="userCount">
                    Registered Users
                </div>

                <div class="user-search">
                    <span>🔍</span>
                    <input
                        type="text"
                        id="searchUser"
                        placeholder="Search by name or email..."
                        autocomplete="off">
                </div>

                <button type="button" id="refreshBtn" class="refresh-btn">
                    ↻ Refresh Users
                </button>

            </div>

            <a href="#" id="historyLink" class="history-link">
                View Customer Login History
            </a>

            <div class="table-container">

                <div id="loading" class="loading">
                    Loading registered users...
                </div>

                <div class="users-table-wrapper">

                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Registered At</th>
                                <th>Last Login</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="usersTableBody"></tbody>
                    </table>

                </div>

                <div id="emptyMessage" class="empty-message"
                     style="display:none;"></div>

            </div>
        </div>
    </section>

    <footer class="admin-footer">
        <p>💅 Nail Studio — Admin Panel</p>
    </footer>

    <script>
        // API URLS
        const API_BASE_URL =
            "https://nail-studio-backend-k604.onrender.com";

        const API_URL = API_BASE_URL + "/api/users";
        const ADMIN_API_URL = API_BASE_URL + "/api/admin";

        let usersData = [];
        let logoutInProgress = false;

        const loading = document.getElementById("loading");
        const table = document.getElementById("usersTable");
        const tableBody = document.getElementById("usersTableBody");
        const emptyMessage = document.getElementById("emptyMessage");
        const userCount = document.getElementById("userCount");
        const refreshBtn = document.getElementById("refreshBtn");
        const searchInput = document.getElementById("searchUser");
        const logoutBtn = document.getElementById("logoutBtn");

        // CHECK ADMIN LOGIN
        async function checkAdminLogin() {
            try {
                const response = await fetch(
                    ADMIN_API_URL + "/check",
                    {
                        method: "GET",
                        credentials: "include",
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    console.error(
                        "Admin check failed:",
                        response.status
                    );

                    window.location.href = "admin-login.html";
                    return false;
                }

                const result = (await response.text()).trim();

                if (result !== "Admin authenticated") {
                    window.location.href = "admin-login.html";
                    return false;
                }

                console.log("Admin authenticated");
                return true;

            } catch (error) {
                console.error("Admin authentication error:", error);

                loading.textContent =
                    "Unable to contact the server. Check your connection and try again.";

                return false;
            }
        }

        // LOGOUT - SAME AS ADMIN BOOKINGS PAGE
        logoutBtn.addEventListener("click", async function () {

            if (logoutInProgress) {
                return;
            }

            logoutInProgress = true;
            logoutBtn.disabled = true;
            logoutBtn.textContent = "Logging out...";

            try {
                await fetch(ADMIN_API_URL + "/logout", {
                    method: "POST",
                    credentials: "include",
                    cache: "no-store"
                });
            } catch (error) {
                console.error("Logout request error:", error);
            } finally {
                // Clear the local admin login information
                localStorage.removeItem("adminLoggedIn");
                localStorage.removeItem("adminEmail");
                localStorage.removeItem("adminToken");

                // Redirect to admin login page
                window.location.replace("admin-login.html");
            }
        });

        // SAFELY CREATE TABLE CELLS
        function addCell(row, value, className) {
            const cell = document.createElement("td");
            const span = document.createElement("span");

            span.textContent =
                value == null || value === "" ? "—" : String(value);

            if (className) {
                span.className = className;
            }

            cell.appendChild(span);
            row.appendChild(cell);

            return cell;
        }

        // FORMAT DATE
        function formatDate(value) {
            if (!value) {
                return "—";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return String(value).replace("T", " ");
            }

            return date.toLocaleString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        // LOAD REGISTERED USERS
        async function loadUsers() {
            loading.style.display = "block";
            loading.textContent = "Loading registered users...";
            table.style.display = "none";
            emptyMessage.style.display = "none";
            tableBody.innerHTML = "";
            refreshBtn.disabled = true;

            try {
                const response = await fetch(
                    API_URL + "/all?_=" + Date.now(),
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Accept": "application/json"
                        },
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    const details = await response.text();

                    throw new Error(
                        "Unable to load users. HTTP " +
                        response.status + ". " + details
                    );
                }

                const result = await response.json();

                if (!Array.isArray(result)) {
                    throw new Error(
                        "The users API did not return a list."
                    );
                }

                usersData = result;

                console.log("Registered users:", usersData);

                loading.style.display = "none";

                updateUserCount();
                displayUsers();

            } catch (error) {
                console.error("User loading error:", error);

                loading.style.display = "none";
                table.style.display = "none";
                userCount.textContent = "Registered Users";

                emptyMessage.style.display = "block";
                emptyMessage.innerHTML = "";

                const box = document.createElement("div");
                box.className = "user-empty";

                const icon = document.createElement("div");
                icon.className = "user-empty-icon";
                icon.textContent = "⚠️";

                const message = document.createElement("p");
                message.textContent = error.message;

                const retry = document.createElement("button");
                retry.type = "button";
                retry.className = "refresh-btn";
                retry.textContent = "Try Again";
                retry.addEventListener("click", loadUsers);

                box.append(icon, message, retry);
                emptyMessage.appendChild(box);

            } finally {
                refreshBtn.disabled = false;
            }
        }

        // UPDATE USER COUNT
        function updateUserCount() {
            userCount.innerHTML = "";

            userCount.appendChild(
                document.createTextNode("Registered Users ")
            );

            const count = document.createElement("span");
            count.textContent = "(" + usersData.length + ")";

            userCount.appendChild(count);
        }

        // DISPLAY AND SEARCH USERS
        function displayUsers() {
            tableBody.innerHTML = "";

            const searchText =
                searchInput.value.trim().toLowerCase();

            const filteredUsers = usersData.filter(function (user) {
                const name = String(user.name || "").toLowerCase();
                const email = String(user.email || "").toLowerCase();

                return name.includes(searchText) ||
                    email.includes(searchText);
            });

            if (filteredUsers.length === 0) {
                table.style.display = "none";
                emptyMessage.style.display = "block";
                emptyMessage.innerHTML = "";

                const box = document.createElement("div");
                box.className = "user-empty";

                const icon = document.createElement("div");
                icon.className = "user-empty-icon";
                icon.textContent =
                    usersData.length === 0 ? "👥" : "🔍";

                const message = document.createElement("p");
                message.textContent =
                    usersData.length === 0
                        ? "No registered users found."
                        : "No users found for your search.";

                box.append(icon, message);
                emptyMessage.appendChild(box);

                return;
            }

            emptyMessage.style.display = "none";
            table.style.display = "table";

            filteredUsers.forEach(function (user) {
                const row = document.createElement("tr");

                addCell(row, user.id, "user-id");
                addCell(row, user.name, "user-name");
                addCell(row, user.email, "user-email");
                addCell(row, formatDate(user.createdAt), "user-date");
                addCell(row, formatDate(user.lastLogin), "user-date");

                const actionCell = document.createElement("td");
                actionCell.className = "user-action";

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "🗑️ Delete";

                deleteButton.addEventListener("click", function () {
                    deleteUser(user.id, user.name, deleteButton);
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                tableBody.appendChild(row);
            });
        }

        // DELETE REGISTERED USER
        async function deleteUser(id, name, button) {
            if (!confirm(
                "Are you sure you want to delete " +
                (name || "this user") + "?"
            )) {
                return;
            }

            button.disabled = true;
            button.textContent = "Deleting...";

            try {
                const response = await fetch(
                    API_URL + "/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

                const resultText = await response.text();

                if (!response.ok) {
                    throw new Error(
                        "Delete failed. HTTP " +
                        response.status + ". " + resultText
                    );
                }

                alert("User deleted successfully.");
                await loadUsers();

            } catch (error) {
                console.error("Delete user error:", error);
                alert(error.message || "Unable to delete user.");

                button.disabled = false;
                button.textContent = "🗑️ Delete";
            }
        }

        // SEARCH USERS
        searchInput.addEventListener("input", displayUsers);

        // REFRESH USERS
        refreshBtn.addEventListener("click", loadUsers);

        // CUSTOMER LOGIN HISTORY
        document.getElementById("historyLink").addEventListener(
            "click",
            function (event) {
                event.preventDefault();

                window.open(
                    API_URL + "/login-history",
                    "_blank",
                    "noopener"
                );
            }
        );

        // START PAGE
        document.addEventListener("DOMContentLoaded", async function () {
            console.log("💅 ADMIN USERS PAGE LOADED");
            console.log("Backend:", API_BASE_URL);

            const isAdmin = await checkAdminLogin();

            if (isAdmin) {
                await loadUsers();
            }
        });
    </script>

</body>
</html>
