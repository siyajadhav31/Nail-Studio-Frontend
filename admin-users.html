
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Users | Nail Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fffaf8;
            color: #49393e;
            font-family: 'Poppins', sans-serif;
        }

        .admin-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 16px 5%;
            background: #fff;
            box-shadow: 0 2px 12px rgba(80, 50, 30, 0.08);
        }

        .admin-logo {
            color: #49393e;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
        }

        .admin-nav-right {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-nav-link {
            color: #49393e;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
        }

        .admin-nav-link:hover,
        .admin-nav-link.active {
            background: #c89b3c;
            color: white;
        }

        .logout-btn {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            background: #49393e;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #302329;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-bookings {
            padding: 45px 20px;
            min-height: 80vh;
        }

        .admin-container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .admin-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-title span {
            display: inline-block;
            color: #b8860b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .admin-title h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 44px;
            font-weight: 700;
        }

        .admin-title p {
            color: #8c7770;
            font-size: 14px;
        }

        .users-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .registered-count {
            font-size: 15px;
            font-weight: 500;
            color: #555;
        }

        .registered-count span {
            color: #b8860b;
            font-weight: 600;
        }

        .user-search {
            position: relative;
            width: 280px;
        }

        .user-search input {
            width: 100%;
            padding: 11px 15px 11px 40px;
            border: 1px solid #e5d4cc;
            border-radius: 12px;
            background: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.3s ease;
        }

        .user-search input:focus {
            border-color: #c89b3c;
            box-shadow: 0 0 0 3px rgba(200, 155, 60, 0.10);
        }

        .user-search span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .refresh-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #c89b3c, #b8860b);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(184, 134, 11, 0.25);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: #fff;
            border: 1px solid #eadfd8;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(80, 50, 30, 0.07);
        }

        .users-table-wrapper {
            overflow-x: auto;
            width: 100%;
        }

        #usersTable {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            display: none;
        }

        #usersTable thead {
            background: #49393e;
        }

        #usersTable th {
            padding: 15px;
            color: white;
            text-align: left;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        #usersTable td {
            padding: 16px 15px;
            border-bottom: 1px solid #eee5e0;
            vertical-align: middle;
            font-size: 13px;
        }

        #usersTable tbody tr:hover {
            background: #fffaf5;
        }

        #usersTable tbody tr:last-child td {
            border-bottom: none;
        }

        .user-name {
            font-weight: 500;
            color: #333;
        }

        .user-email {
            color: #666;
            overflow-wrap: anywhere;
        }

        .user-id {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 30px;
            padding: 0 8px;
            border-radius: 9px;
            background: #fff4ef;
            color: #b8860b;
            font-size: 12px;
            font-weight: 600;
        }

        .user-action {
            white-space: nowrap;
        }

        .delete-btn {
            border: none;
            border-radius: 7px;
            padding: 8px 11px;
            background: #dc3545;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            cursor: pointer;
        }

        .delete-btn:hover:not(:disabled) {
            background: #b92332;
        }

        .user-date {
            color: #666;
            font-size: 12px;
            white-space: nowrap;
        }

        .loading,
        .empty-message {
            padding: 35px 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .user-empty-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .history-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #a47712;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .history-link:hover {
            text-decoration: underline;
        }

        .admin-footer {
            padding: 20px;
            text-align: center;
            color: #8c7770;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            .users-page-header {
                align-items: stretch;
            }

            .user-search {
                width: 100%;
            }

            .refresh-btn {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .admin-navbar {
                align-items: flex-start;
            }

            .admin-nav-right {
                width: 100%;
            }

            .admin-nav-link {
                padding: 9px;
            }

            .users-page-header {
                flex-direction: column;
            }

            .registered-count {
                text-align: left;
            }

            .admin-bookings {
                padding: 30px 12px;
            }

            .admin-title h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="admin-navbar">

        <a href="admin-bookings.html" class="admin-logo">
            💅 Nail Studio
        </a>

        <div class="admin-nav-right">

            <a href="admin-bookings.html" class="admin-nav-link">
                Customer Bookings
            </a>

            <a href="admin-users.html" class="admin-nav-link active">
                Registered Users
            </a>

            <button type="button" id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>
    </nav>
</header>

<section class="admin-bookings">
    <div class="admin-container">

        <div class="admin-title">
            <span>✨ Nail Studio Administration</span>
            <h1>Registered Users</h1>
            <p>Manage all registered customers from one place.</p>
        </div>

        <div class="users-page-header">

            <div class="registered-count" id="userCount">
                Registered Users
            </div>

            <div class="user-search">
                <span>🔍</span>
                <input
                    type="text"
                    id="searchUser"
                    placeholder="Search by name or email..."
                    autocomplete="off">
            </div>

            <button type="button" id="refreshBtn" class="refresh-btn">
                ↻ Refresh Users
            </button>

        </div>

        <a href="#" id="historyLink" class="history-link">
            View Customer Login History
        </a>

        <div class="table-container">

            <div id="loading" class="loading">
                Checking admin session...
            </div>

            <div class="users-table-wrapper">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Registered At</th>
                            <th>Last Login</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

            <div id="emptyMessage" class="empty-message"
                 style="display:none;"></div>

        </div>
    </div>
</section>

<footer class="admin-footer">
    <p>💅 Nail Studio — Admin Panel</p>
</footer>

<script>
"use strict";

// BACKEND URL
const API_BASE_URL =
    "https://nail-studio-backend-k604.onrender.com";

const API_URL = API_BASE_URL + "/api/users";
const ADMIN_API_URL = API_BASE_URL + "/api/admin";

let usersData = [];
let logoutInProgress = false;
let redirectingToLogin = false;

const loading = document.getElementById("loading");
const table = document.getElementById("usersTable");
const tableBody = document.getElementById("usersTableBody");
const emptyMessage = document.getElementById("emptyMessage");
const userCount = document.getElementById("userCount");
const refreshBtn = document.getElementById("refreshBtn");
const searchInput = document.getElementById("searchUser");
const logoutBtn = document.getElementById("logoutBtn");
const historyLink = document.getElementById("historyLink");

// API response helper
async function readResponse(response) {
    const text = await response.text();

    let data = text;

    try {
        data = text ? JSON.parse(text) : null;
    } catch (error) {
        // Keep plain-text responses as text.
    }

    return { text, data };
}

// Check server-side admin session
async function checkAdminLogin() {
    try {
        const response = await fetch(
            ADMIN_API_URL + "/check",
            {
                method: "GET",
                credentials: "include",
                cache: "no-store",
                headers: {
                    "Accept": "text/plain, application/json"
                }
            }
        );

        const result = await readResponse(response);
        const message = typeof result.data === "string"
            ? result.data.trim()
            : result.text.trim();

        if (!response.ok ||
            message !== "Admin authenticated") {

            console.error(
                "Admin session check failed:",
                response.status,
                result.text
            );

            loading.textContent =
                "Admin login required. Redirecting to login...";

            redirectingToLogin = true;

            setTimeout(function () {
                window.location.replace("admin-login.html");
            }, 800);

            return false;
        }

        console.log("Admin authenticated");
        return true;

    } catch (error) {
        console.error("Admin session check error:", error);

        loading.textContent =
            "Unable to contact the server. Check your internet connection and try again.";

        showRetryButton();
        return false;
    }
}

// Logout
logoutBtn.addEventListener("click", async function () {
    if (logoutInProgress) return;

    logoutInProgress = true;
    logoutBtn.disabled = true;
    logoutBtn.textContent = "Logging out...";

    try {
        const response = await fetch(
            ADMIN_API_URL + "/logout",
            {
                method: "POST",
                credentials: "include",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            console.error("Server logout:", response.status);
        }

    } catch (error) {
        console.error("Logout request error:", error);

    } finally {
        localStorage.removeItem("adminLoggedIn");
        localStorage.removeItem("adminEmail");
        localStorage.removeItem("adminToken");

        window.location.replace("admin-login.html");
    }
});

// Create table cell safely
function addCell(row, value, className) {
    const cell = document.createElement("td");
    const span = document.createElement("span");

    span.textContent =
        value === null || value === undefined || value === ""
            ? "—"
            : String(value);

    if (className) {
        span.className = className;
    }

    cell.appendChild(span);
    row.appendChild(cell);

    return cell;
}

// Format date
function formatDate(value) {
    if (!value) return "—";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value).replace("T", " ");
    }

    return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

// Show retry button
function showRetryButton() {
    emptyMessage.style.display = "block";
    emptyMessage.replaceChildren();

    const box = document.createElement("div");
    const icon = document.createElement("div");
    const message = document.createElement("p");
    const retry = document.createElement("button");

    icon.className = "user-empty-icon";
    icon.textContent = "⚠️";

    message.textContent =
        "Could not verify the admin session. Please try again.";

    retry.type = "button";
    retry.className = "refresh-btn";
    retry.textContent = "Try Again";

    retry.addEventListener("click", async function () {
        emptyMessage.style.display = "none";
        loading.style.display = "block";
        loading.textContent = "Checking admin session...";

        const isAdmin = await checkAdminLogin();

        if (isAdmin) {
            await loadUsers();
        }
    });

    box.append(icon, message, retry);
    emptyMessage.appendChild(box);
}

// Load registered users
async function loadUsers() {
    if (redirectingToLogin) return;

    loading.style.display = "block";
    loading.textContent = "Loading registered users...";
    table.style.display = "none";
    emptyMessage.style.display = "none";
    tableBody.replaceChildren();
    refreshBtn.disabled = true;

    try {
        const response = await fetch(
            API_URL + "/all?_=" + Date.now(),
            {
                method: "GET",
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const result = await readResponse(response);

        if (response.status === 401 || response.status === 403) {
            throw new Error(
                "Admin login required (HTTP " +
                response.status +
                "). Your backend session is not being accepted. Log in again; if this continues, the backend session/CORS configuration needs fixing."
            );
        }

        if (!response.ok) {
            const message = result.data &&
                typeof result.data === "object"
                ? result.data.message
                : result.text;

            throw new Error(
                "Unable to load users. HTTP " +
                response.status + ": " +
                (message || "Unknown server error")
            );
        }

        const users = result.data;

        if (!Array.isArray(users)) {
            throw new Error(
                "The users API did not return a list."
            );
        }

        usersData = users;

        console.log("Registered users:", usersData);

        loading.style.display = "none";
        updateUserCount();
        displayUsers();

    } catch (error) {
        console.error("User loading error:", error);

        loading.style.display = "none";
        table.style.display = "none";
        userCount.textContent = "Registered Users";

        emptyMessage.style.display = "block";
        emptyMessage.replaceChildren();

        const box = document.createElement("div");
        const icon = document.createElement("div");
        const message = document.createElement("p");
        const retry = document.createElement("button");

        icon.className = "user-empty-icon";
        icon.textContent = "⚠️";

        message.textContent = error.message;

        retry.type = "button";
        retry.className = "refresh-btn";
        retry.textContent = "Try Again";
        retry.addEventListener("click", loadUsers);

        box.append(icon, message, retry);
        emptyMessage.appendChild(box);

    } finally {
        refreshBtn.disabled = false;
    }
}

// Update user count
function updateUserCount() {
    userCount.replaceChildren();

    userCount.appendChild(
        document.createTextNode("Registered Users ")
    );

    const count = document.createElement("span");
    count.textContent = "(" + usersData.length + ")";

    userCount.appendChild(count);
}

// Display and search users
function displayUsers() {
    tableBody.replaceChildren();

    const searchText = searchInput.value.trim().toLowerCase();

    const filteredUsers = usersData.filter(function (user) {
        const name = String(user.name || "").toLowerCase();
        const email = String(user.email || "").toLowerCase();

        return name.includes(searchText) ||
            email.includes(searchText);
    });

    if (filteredUsers.length === 0) {
        table.style.display = "none";
        emptyMessage.style.display = "block";
        emptyMessage.replaceChildren();

        const box = document.createElement("div");
        const icon = document.createElement("div");
        const message = document.createElement("p");

        icon.className = "user-empty-icon";
        icon.textContent = usersData.length === 0 ? "👥" : "🔍";

        message.textContent = usersData.length === 0
            ? "No registered users found."
            : "No users found for your search.";

        box.append(icon, message);
        emptyMessage.appendChild(box);

        return;
    }

    emptyMessage.style.display = "none";
    table.style.display = "table";

    filteredUsers.forEach(function (user) {
        const row = document.createElement("tr");

        addCell(row, user.id, "user-id");
        addCell(row, user.name, "user-name");
        addCell(row, user.email, "user-email");
        addCell(row, formatDate(user.createdAt), "user-date");
        addCell(row, formatDate(user.lastLogin), "user-date");

        const actionCell = document.createElement("td");
        actionCell.className = "user-action";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "🗑️ Delete";

        deleteButton.addEventListener("click", function () {
            deleteUser(user.id, user.name, deleteButton);
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);
        tableBody.appendChild(row);
    });
}

// Delete registered user
async function deleteUser(id, name, button) {
    if (!confirm(
        "Are you sure you want to delete " +
        (name || "this user") + "?"
    )) {
        return;
    }

    button.disabled = true;
    button.textContent = "Deleting...";

    try {
        const response = await fetch(
            API_URL + "/" + encodeURIComponent(id),
            {
                method: "DELETE",
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        const result = await readResponse(response);

        if (response.status === 401 || response.status === 403) {
            throw new Error(
                "Admin login required. Please log in again."
            );
        }

        if (!response.ok) {
            throw new Error(
                "Delete failed. HTTP " +
                response.status + ": " + result.text
            );
        }

        alert("User deleted successfully.");
        await loadUsers();

    } catch (error) {
        console.error("Delete user error:", error);
        alert(error.message || "Unable to delete user.");

        button.disabled = false;
        button.textContent = "🗑️ Delete";
    }
}

// Search users
searchInput.addEventListener("input", displayUsers);

// Refresh users
refreshBtn.addEventListener("click", loadUsers);

// Customer login history
historyLink.addEventListener("click", async function (event) {
    event.preventDefault();

    try {
        const response = await fetch(
            API_URL + "/login-history",
            {
                method: "GET",
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const result = await readResponse(response);

        if (response.status === 401 || response.status === 403) {
            throw new Error(
                "Admin login required. Please log in again."
            );
        }

        if (!response.ok) {
            throw new Error(
                "Unable to load login history. HTTP " +
                response.status + ": " + result.text
            );
        }

        const history = result.data;

        if (!Array.isArray(history)) {
            throw new Error(
                "The login history API did not return a list."
            );
        }

        const historyWindow = window.open("", "_blank");

        if (!historyWindow) {
            alert("Please allow pop-ups to view login history.");
            return;
        }

        historyWindow.document.title = "Customer Login History";

        const style = historyWindow.document.createElement("style");
        style.textContent = `
            body {
                font-family: Arial, sans-serif;
                padding: 20px;
                color: #49393e;
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th, td {
                padding: 12px;
                border: 1px solid #ddd;
                text-align: left;
            }

            th {
                background: #49393e;
                color: white;
            }

            tr:nth-child(even) {
                background: #fffaf8;
            }
        `;

        historyWindow.document.head.appendChild(style);

        const heading = historyWindow.document.createElement("h2");
        heading.textContent = "Nail Studio - Customer Login History";
        historyWindow.document.body.appendChild(heading);

        if (history.length === 0) {
            const message = historyWindow.document.createElement("p");
            message.textContent = "No login history found.";
            historyWindow.document.body.appendChild(message);
            return;
        }

        const historyTable = historyWindow.document.createElement("table");
        const header = historyWindow.document.createElement("tr");

        ["ID", "Name", "Email", "Login Time"].forEach(function (title) {
            const th = historyWindow.document.createElement("th");
            th.textContent = title;
            header.appendChild(th);
        });

        historyTable.appendChild(header);

        history.forEach(function (record) {
            const row = historyWindow.document.createElement("tr");

            [
                record.id,
                record.name,
                record.email,
                formatDate(record.loginTime)
            ].forEach(function (value) {
                const td = historyWindow.document.createElement("td");
                td.textContent = value == null ? "—" : String(value);
                row.appendChild(td);
            });

            historyTable.appendChild(row);
        });

        historyWindow.document.body.appendChild(historyTable);

    } catch (error) {
        console.error("Login history error:", error);
        alert(error.message || "Unable to load login history.");
    }
});

// Start page
document.addEventListener("DOMContentLoaded", async function () {
    console.log("💅 ADMIN USERS PAGE LOADED");
    console.log("Backend:", API_BASE_URL);

    const isAdmin = await checkAdminLogin();

    if (isAdmin) {
        await loadUsers();
    }
});
</script>

</body>
</html>
