<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Offer Booking | Nail Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <style>

        /* =================================
           BODY
        ================================= */

        body {

            margin: 0;

            font-family: 'Poppins', sans-serif;

            background: #fffaf8;

            color: #333;

        }


        /* =================================
           NAVBAR
        ================================= */

        .navbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 8%;

            background: white;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.06);

        }


        .logo {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 28px;

            font-weight: 700;

            color: #333;

        }


        .nav-links {

            display: flex;

            list-style: none;

            gap: 25px;

            margin: 0;

            padding: 0;

        }


        .nav-links a {

            text-decoration: none;

            color: #444;

            font-size: 14px;

            transition: 0.3s;

        }


        .nav-links a:hover {

            color: #c89b3c;

        }


        /* =================================
           BOOKING SECTION
        ================================= */

        .booking-section {

            min-height: calc(100vh - 160px);

            padding: 70px 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #fffaf8,
                    #fff4ef
                );

        }


        /* =================================
           BOOKING CONTAINER
        ================================= */

        .booking-container {

            width: 100%;

            max-width: 650px;

            background: white;

            padding: 45px;

            border-radius: 22px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.10);

            border:
                1px solid #f1dfd8;

        }


        /* =================================
           HEADING
        ================================= */

        .booking-heading {

            text-align: center;

            margin-bottom: 35px;

        }


        .booking-heading h1 {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 48px;

            margin: 0 0 8px;

            color: #333;

        }


        .booking-heading p {

            color: #777;

            font-size: 14px;

            margin-bottom: 12px;

        }


        .booking-heading h2 {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 30px;

            color: #c89b3c;

            margin: 10px 0 0;

        }


        /* =================================
           FORM
        ================================= */

        #offerBookingForm {

            width: 100%;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 500;

            color: #444;

        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 13px 15px;

            box-sizing: border-box;

            border:
                1px solid #e5d4cc;

            border-radius: 10px;

            outline: none;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            background: #fff;

            color: #333;

            transition: 0.3s;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #c89b3c;

            box-shadow:
                0 0 0 3px
                rgba(200, 155, 60, 0.10);

        }


        .form-group input::placeholder {

            color: #aaa;

        }


        /* =================================
           BOOK BUTTON
        ================================= */

        .gold-btn {

            width: 100%;

            border: none;

            padding: 14px 25px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #c89b3c,
                    #b8860b
                );

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;

        }


        .gold-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(200, 155, 60, 0.30);

        }


        .gold-btn:disabled {

            opacity: 0.75;

            cursor: not-allowed;

            transform: none;

        }


        /* =================================
           BOOKING STATUS
        ================================= */

        .booking-status {

            display: none;

            text-align: center;

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

        }


        .booking-status.show {

            display: block;

        }


        .booking-status.loading {

            background: #fff7e6;

            color: #9a6a00;

            border: 1px solid #f1d79a;

        }


        .booking-status.success {

            background: #edf9f1;

            color: #247a42;

            border: 1px solid #b9e3c5;

        }


        .booking-status.error {

            background: #fff0f0;

            color: #b42318;

            border: 1px solid #f0b8b8;

        }


        /* =================================
           BACK LINK
        ================================= */

        .back-link {

            text-align: center;

            margin-top: 25px;

        }


        .back-link a {

            text-decoration: none;

            color: #b8860b;

            font-size: 13px;

            transition: 0.3s;

        }


        .back-link a:hover {

            color: #c89b3c;

        }


        /* =================================
           FOOTER
        ================================= */

        footer {

            background: #222;

            color: white;

            text-align: center;

            padding: 30px 20px;

        }


        footer h2 {

            font-family:
                'Cormorant Garamond',
                serif;

            margin-bottom: 8px;

        }


        footer h2 a {

            color: white;

            text-decoration: none;

            transition: 0.3s;

        }


        footer h2 a:hover {

            color: #c89b3c;

        }


        footer p {

            font-size: 13px;

            color: #ddd;

            margin: 5px 0;

        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1000px) {

            .nav-links {

                gap: 15px;

            }

        }


        @media (max-width: 800px) {

            .nav-links {

                display: none;

            }


            .booking-container {

                padding: 35px 25px;

            }

        }


        @media (max-width: 500px) {

            .booking-section {

                padding: 40px 15px;

            }


            .booking-container {

                padding: 30px 20px;

                border-radius: 15px;

            }


            .booking-heading h1 {

                font-size: 40px;

            }


            .booking-heading h2 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         NAVBAR
    ================================= -->

    <nav class="navbar">

        <div class="logo">

            💅 Nail Studio

        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="services.html">
                    Services
                </a>
            </li>

            <li>
                <a href="offer.html">
                    Offers
                </a>
            </li>

            <li>
                <a href="faqs.html">
                    FAQs
                </a>
            </li>

            <li>
                <a href="gallery.html">
                    Gallery
                </a>
            </li>

            <li>
                <a href="booking.html">
                    Booking
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- =================================
         OFFER BOOKING
    ================================= -->

    <section class="booking-section">

        <div class="booking-container">


            <div class="booking-heading">

                <h1>
                    ✨ Offer Booking
                </h1>

                <p>
                    Book your special offer appointment with us.
                </p>

                <h2 id="offerName">
                    Special Offer
                </h2>

            </div>


            <!-- =================================
                 OFFER BOOKING FORM
            ================================= -->

            <form id="offerBookingForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="offerNameInput">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="offerNameInput"
                        placeholder="Enter your name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="offerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="offerEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="offerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="offerPhone"
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        inputmode="numeric"
                        required>

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="offerDate">
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        id="offerDate"
                        required>

                </div>


                <!-- TIME -->

                <div class="form-group">

                    <label for="offerTime">
                        🕒 Appointment Time
                    </label>

                    <select
                        id="offerTime"
                        required>

                        <option value="">
                            Select a time
                        </option>

                        <option value="11:00 AM">
                            11:00 AM
                        </option>

                        <option value="12:00 PM">
                            12:00 PM
                        </option>

                        <option value="1:00 PM">
                            1:00 PM
                        </option>

                        <option value="2:00 PM">
                            2:00 PM
                        </option>

                        <option value="3:00 PM">
                            3:00 PM
                        </option>

                        <option value="4:00 PM">
                            4:00 PM
                        </option>

                        <option value="5:00 PM">
                            5:00 PM
                        </option>

                        <option value="6:00 PM">
                            6:00 PM
                        </option>

                        <option value="7:00 PM">
                            7:00 PM
                        </option>

                        <option value="8:00 PM">
                            8:00 PM
                        </option>

                        <option value="9:00 PM">
                            9:00 PM
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="gold-btn"
                    id="bookButton">

                    💅 Book Appointment

                </button>


                <!-- STATUS -->

                <div
                    id="bookingStatus"
                    class="booking-status">

                </div>


            </form>


            <div class="back-link">

                <a href="offer.html">

                    ← Back to Offers

                </a>

            </div>


        </div>

    </section>


    <!-- =================================
         FOOTER
    ================================= -->

    <footer>

        <h2>

            <a href="index.html">

                💅 Nail Studio

            </a>

        </h2>


        <p>

            Luxury Nails | Modern Technology | Perfect Experience

        </p>


        <p>

            © 2026 Nail Studio

        </p>

    </footer>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        /* =================================
           API
        ================================= */

        const API_URL =
            "https://nail-studio-backend-k604.onrender.com/api/bookings";


        /* =================================
           DOM READY
        ================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                console.log(
                    "================================="
                );

                console.log(
                    "💅 OFFER BOOKING PAGE LOADED"
                );

                console.log(
                    "Backend:",
                    API_URL
                );

                console.log(
                    "================================="
                );


                /* =================================
                   GET SELECTED OFFER
                ================================= */

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );


                const selectedOffer =
                    urlParams.get("offer");


                const offerName =
                    document.getElementById(
                        "offerName"
                    );


                if (selectedOffer) {

                    offerName.textContent =
                        selectedOffer;

                }


                /* =================================
                   DATE - TODAY MINIMUM
                ================================= */

                const dateInput =
                    document.getElementById(
                        "offerDate"
                    );


                const today =
                    new Date()
                        .toISOString()
                        .split("T")[0];


                dateInput.min = today;


                /* =================================
                   PHONE - ONLY NUMBERS
                ================================= */

                const phoneInput =
                    document.getElementById(
                        "offerPhone"
                    );


                phoneInput.addEventListener(
                    "input",
                    function () {

                        this.value =
                            this.value
                                .replace(/\D/g, "")
                                .slice(0, 10);

                    }
                );


                /* =================================
                   FORM
                ================================= */

                const form =
                    document.getElementById(
                        "offerBookingForm"
                    );


                const bookButton =
                    document.getElementById(
                        "bookButton"
                    );


                const bookingStatus =
                    document.getElementById(
                        "bookingStatus"
                    );


                /* =================================
                   STATUS FUNCTION
                ================================= */

                function showStatus(
                    message,
                    type
                ) {

                    bookingStatus.textContent =
                        message;

                    bookingStatus.className =
                        "booking-status show " +
                        type;

                }


                /* =================================
                   HIDE STATUS
                ================================= */

                function hideStatus() {

                    bookingStatus.textContent =
                        "";

                    bookingStatus.className =
                        "booking-status";

                }


                /* =================================
                   WAKE UP RENDER BACKEND
                   
                   This runs in background.
                   It helps wake Render before
                   customer submits the form.
                ================================= */

                async function wakeBackend() {

                    try {

                        console.log(
                            "🔥 Warming up booking server..."
                        );


                        const controller =
                            new AbortController();


                        const timeout =
                            setTimeout(
                                function () {

                                    controller.abort();

                                },
                                90000
                            );


                        await fetch(
                            API_URL,
                            {
                                method: "GET",

                                headers: {
                                    "Accept":
                                        "application/json"
                                },

                                credentials:
                                    "include",

                                cache:
                                    "no-store",

                                signal:
                                    controller.signal
                            }
                        );


                        clearTimeout(
                            timeout
                        );


                        console.log(
                            "🔥 Booking server is awake."
                        );

                    }
                    catch (error) {

                        console.log(
                            "Backend warm-up finished/failed:",
                            error
                        );

                    }

                }


                /*
                 * Start backend warm-up
                 * without blocking the page.
                 */

                wakeBackend();


                /* =================================
                   FORM SUBMIT
                ================================= */

                form.addEventListener(
                    "submit",
                    async function (e) {

                        e.preventDefault();


                        /*
                         * Prevent double click
                         */

                        if (
                            bookButton.disabled
                        ) {

                            return;

                        }


                        /* =================================
                           GET FORM DATA
                        ================================= */

                        const name =
                            document.getElementById(
                                "offerNameInput"
                            ).value.trim();


                        const email =
                            document.getElementById(
                                "offerEmail"
                            ).value.trim();


                        const phone =
                            document.getElementById(
                                "offerPhone"
                            ).value.trim();


                        const bookingDate =
                            document.getElementById(
                                "offerDate"
                            ).value;


                        const bookingTime =
                            document.getElementById(
                                "offerTime"
                            ).value;


                        /* =================================
                           VALIDATION
                        ================================= */

                        if (!name) {

                            showStatus(
                                "Please enter your name.",
                                "error"
                            );

                            return;

                        }


                        if (!email) {

                            showStatus(
                                "Please enter your email.",
                                "error"
                            );

                            return;

                        }


                        if (
                            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                                .test(email)
                        ) {

                            showStatus(
                                "Please enter a valid email address.",
                                "error"
                            );

                            return;

                        }


                        if (
                            !/^[0-9]{10}$/.test(phone)
                        ) {

                            showStatus(
                                "Please enter a valid 10-digit phone number.",
                                "error"
                            );

                            return;

                        }


                        if (!bookingDate) {

                            showStatus(
                                "Please select an appointment date.",
                                "error"
                            );

                            return;

                        }


                        if (!bookingTime) {

                            showStatus(
                                "Please select an appointment time.",
                                "error"
                            );

                            return;

                        }


                        /* =================================
                           SUNDAY CHECK
                        ================================= */

                        const selectedDate =
                            new Date(
                                bookingDate +
                                "T00:00:00"
                            );


                        if (
                            selectedDate.getDay() === 0
                        ) {

                            showStatus(
                                "Sunday is closed. Please select another date.",
                                "error"
                            );

                            return;

                        }


                        /* =================================
                           BOOKING DATA
                        ================================= */

                        const bookingData = {

                            name:
                                name,

                            email:
                                email,

                            phone:
                                phone,

                            service:
                                selectedOffer ||
                                "Special Offer",

                            design:
                                "Offer Booking",

                            bookingDate:
                                bookingDate,

                            bookingTime:
                                bookingTime,

                            bookingType:
                                "OFFER"

                        };


                        console.log(
                            "================================="
                        );

                        console.log(
                            "🎁 OFFER BOOKING DATA"
                        );

                        console.log(
                            bookingData
                        );

                        console.log(
                            "================================="
                        );


                        /* =================================
                           DISABLE BUTTON
                        ================================= */

                        bookButton.disabled =
                            true;


                        bookButton.textContent =
                            "⏳ Booking...";


                        showStatus(
                            "⏳ Connecting to booking server... Please wait.",
                            "loading"
                        );


                        /* =================================
                           ABORT CONTROLLER
                        ================================= */

                        const controller =
                            new AbortController();


                        /*
                         * 90 seconds timeout.
                         *
                         * Render cold start can take
                         * some time.
                         */

                        const timeout =
                            setTimeout(
                                function () {

                                    controller.abort();

                                },
                                90000
                            );


                        /* =================================
                           SEND BOOKING
                        ================================= */

                        try {

                            console.log(
                                "📤 Sending offer booking..."
                            );


                            showStatus(
                                "⏳ Saving your appointment... Please don't close this page.",
                                "loading"
                            );


                            const response =
                                await fetch(
                                    API_URL,
                                    {

                                        method:
                                            "POST",

                                        headers: {

                                            "Content-Type":
                                                "application/json",

                                            "Accept":
                                                "application/json"

                                        },

                                        credentials:
                                            "include",

                                        cache:
                                            "no-store",

                                        signal:
                                            controller.signal,

                                        body:
                                            JSON.stringify(
                                                bookingData
                                            )

                                    }
                                );


                            clearTimeout(
                                timeout
                            );


                            console.log(
                                "Booking API Status:",
                                response.status
                            );


                            /* =================================
                               READ RESPONSE
                            ================================= */

                            const responseText =
                                await response.text();


                            console.log(
                                "Booking API Response:",
                                responseText
                            );


                            /* =================================
                               SERVER ERROR
                            ================================= */

                            if (!response.ok) {

                                let errorMessage =
                                    "Booking failed. Please try again.";


                                try {

                                    const errorData =
                                        JSON.parse(
                                            responseText
                                        );


                                    if (
                                        errorData &&
                                        errorData.message
                                    ) {

                                        errorMessage =
                                            errorData.message;

                                    }

                                }
                                catch (
                                    parseError
                                ) {

                                    if (
                                        responseText
                                    ) {

                                        errorMessage =
                                            responseText;

                                    }

                                }


                                throw new Error(
                                    errorMessage
                                );

                            }


                            /* =================================
                               VERIFY SAVED BOOKING
                            ================================= */

                            let savedBooking =
                                null;


                            try {

                                savedBooking =
                                    JSON.parse(
                                        responseText
                                    );

                            }
                            catch (
                                parseError
                            ) {

                                console.log(
                                    "Response was not JSON."
                                );

                            }


                            console.log(
                                "Saved Booking:",
                                savedBooking
                            );


                            /* =================================
                               SUCCESS
                            ================================= */

                            showStatus(
                                "✨ Appointment booked successfully! Redirecting...",
                                "success"
                            );


                            bookButton.textContent =
                                "✅ Booking Confirmed";


                            /*
                             * Reset form
                             */

                            form.reset();


                            /*
                             * Keep selected offer heading
                             */

                            if (
                                selectedOffer
                            ) {

                                offerName.textContent =
                                    selectedOffer;

                            }


                            /*
                             * Redirect after
                             * short delay
                             */

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "offer.html";

                                },
                                1200
                            );


                        }
                        catch (error) {

                            clearTimeout(
                                timeout
                            );


                            console.error(
                                "❌ Offer Booking Error:",
                                error
                            );


                            /* =================================
                               TIMEOUT
                            ================================= */

                            if (
                                error.name ===
                                "AbortError"
                            ) {

                                showStatus(
                                    "⏰ The booking server is taking too long to respond. Please wait a little and try again.",
                                    "error"
                                );

                            }


                            /* =================================
                               OTHER ERROR
                            ================================= */

                            else {

                                showStatus(
                                    "❌ " +
                                    (
                                        error.message ||
                                        "Unable to book appointment. Please try again."
                                    ),
                                    "error"
                                );

                            }


                            bookButton.disabled =
                                false;


                            bookButton.textContent =
                                "💅 Book Appointment";

                        }

                    }
                );

            }
        );

    </script>


</body>

</html>
