
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Offer Booking | Nail Studio</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <!-- =================================
         PAGE CSS
    ================================= -->

    <style>

        /* =================================
           BODY
        ================================= */

        body {

            margin: 0;

            font-family: 'Poppins', sans-serif;

            background: #fffaf8;

            color: #333;

        }


        /* =================================
           NAVBAR
        ================================= */

        .navbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 8%;

            background: white;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.06);

        }


        .logo {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 28px;

            font-weight: 700;

            color: #333;

        }


        .nav-links {

            display: flex;

            list-style: none;

            gap: 25px;

            margin: 0;

            padding: 0;

        }


        .nav-links a {

            text-decoration: none;

            color: #444;

            font-size: 14px;

            transition: 0.3s;

        }


        .nav-links a:hover {

            color: #c89b3c;

        }


        /* =================================
           OFFER BOOKING SECTION
        ================================= */

        .booking-section {

            min-height: calc(100vh - 160px);

            padding: 70px 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #fffaf8,
                    #fff4ef
                );

        }


        /* =================================
           BOOKING CONTAINER
        ================================= */

        .booking-container {

            width: 100%;

            max-width: 650px;

            background: white;

            padding: 45px;

            border-radius: 22px;

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.10);

            border:
                1px solid #f1dfd8;

        }


        /* =================================
           HEADING
        ================================= */

        .booking-heading {

            text-align: center;

            margin-bottom: 35px;

        }


        .booking-heading h1 {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 48px;

            margin: 0 0 8px;

            color: #333;

        }


        .booking-heading p {

            color: #777;

            font-size: 14px;

            margin-bottom: 12px;

        }


        .booking-heading h2 {

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 30px;

            color: #c89b3c;

            margin: 10px 0 0;

        }


        /* =================================
           FORM
        ================================= */

        #offerBookingForm {

            width: 100%;

        }


        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 500;

            color: #444;

        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 13px 15px;

            box-sizing: border-box;

            border:
                1px solid #e5d4cc;

            border-radius: 10px;

            outline: none;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            background: #fff;

            color: #333;

            transition: 0.3s;

        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #c89b3c;

            box-shadow:
                0 0 0 3px
                rgba(200, 155, 60, 0.10);

        }


        .form-group input::placeholder {

            color: #aaa;

        }


        /* =================================
           BOOK BUTTON
        ================================= */

        .gold-btn {

            width: 100%;

            border: none;

            padding: 14px 25px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #c89b3c,
                    #b8860b
                );

            color: white;

            font-family: 'Poppins', sans-serif;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;

        }


        .gold-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(200, 155, 60, 0.30);

        }


        /* =================================
           BACK LINK
        ================================= */

        .back-link {

            text-align: center;

            margin-top: 25px;

        }


        .back-link a {

            text-decoration: none;

            color: #b8860b;

            font-size: 13px;

            transition: 0.3s;

        }


        .back-link a:hover {

            color: #c89b3c;

        }


        /* =================================
           FOOTER
        ================================= */

        footer {

            background: #222;

            color: white;

            text-align: center;

            padding: 30px 20px;

        }


        footer h2 {

            font-family:
                'Cormorant Garamond',
                serif;

            margin-bottom: 8px;

        }


        footer h2 a {

            color: white;

            text-decoration: none;

            transition: 0.3s;

        }


        footer h2 a:hover {

            color: #c89b3c;

        }


        footer p {

            font-size: 13px;

            color: #ddd;

            margin: 5px 0;

        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1000px) {

            .nav-links {

                gap: 15px;

            }

        }


        @media (max-width: 800px) {

            .nav-links {

                display: none;

            }


            .booking-container {

                padding: 35px 25px;

            }

        }


        @media (max-width: 500px) {

            .booking-section {

                padding: 40px 15px;

            }


            .booking-container {

                padding: 30px 20px;

                border-radius: 15px;

            }


            .booking-heading h1 {

                font-size: 40px;

            }


            .booking-heading h2 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         NAVBAR
    ================================= -->

    <nav class="navbar">

        <div class="logo">
            💅 Nail Studio
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="services.html">
                    Services
                </a>
            </li>

            <li>
                <a href="offer.html">
                    Offers
                </a>
            </li>

            <li>
                <a href="faqs.html">
                    FAQs
                </a>
            </li>

            <li>
                <a href="gallery.html">
                    Gallery
                </a>
            </li>

            <li>
                <a href="booking.html">
                    Booking
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- =================================
         OFFER BOOKING
    ================================= -->

    <section class="booking-section">

        <div class="booking-container">


            <div class="booking-heading">

                <h1>
                    ✨ Offer Booking
                </h1>

                <p>
                    Book your special offer appointment with us.
                </p>

                <h2 id="offerName">
                    Special Offer
                </h2>

            </div>


            <!-- =================================
                 OFFER BOOKING FORM
            ================================= -->

            <form id="offerBookingForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="offerNameInput">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="offerNameInput"
                        placeholder="Enter your name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="offerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="offerEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="offerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="offerPhone"
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        inputmode="numeric"
                        required>

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="offerDate">
                        Appointment Date
                    </label>

                    <input
                        type="date"
                        id="offerDate"
                        required>

                </div>


                <!-- TIME -->

                <div class="form-group">

                    <label for="offerTime">
                        🕒 Appointment Time
                    </label>

                    <select
                        id="offerTime"
                        required>

                        <option value="">
                            Select a time
                        </option>

                        <option value="11:00 AM">
                            11:00 AM
                        </option>

                        <option value="12:00 PM">
                            12:00 PM
                        </option>

                        <option value="1:00 PM">
                            1:00 PM
                        </option>

                        <option value="2:00 PM">
                            2:00 PM
                        </option>

                        <option value="3:00 PM">
                            3:00 PM
                        </option>

                        <option value="4:00 PM">
                            4:00 PM
                        </option>

                        <option value="5:00 PM">
                            5:00 PM
                        </option>

                        <option value="6:00 PM">
                            6:00 PM
                        </option>

                        <option value="7:00 PM">
                            7:00 PM
                        </option>

                        <option value="8:00 PM">
                            8:00 PM
                        </option>

                        <option value="9:00 PM">
                            9:00 PM
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="gold-btn">

                    Book Appointment 💅

                </button>


            </form>


            <div class="back-link">

                <a href="offer.html">
                    ← Back to Offers
                </a>

            </div>


        </div>

    </section>


    <!-- =================================
         FOOTER
    ================================= -->

    <footer>

        <h2>

            <a href="index.html">
                💅 Nail Studio
            </a>

        </h2>

        <p>
            Luxury Nails | Modern Technology | Perfect Experience
        </p>

        <p>
            © 2026 Nail Studio
        </p>

    </footer>


    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================
                   GET SELECTED OFFER
                ================================= */

                const urlParams =
                    new URLSearchParams(
                        window.location.search
                    );

                const selectedOffer =
                    urlParams.get("offer");

                const offerName =
                    document.getElementById(
                        "offerName"
                    );


                if (selectedOffer) {

                    offerName.textContent =
                        selectedOffer;

                }


                /* =================================
                   DATE - TODAY MINIMUM
                ================================= */

                const dateInput =
                    document.getElementById(
                        "offerDate"
                    );

                const today =
                    new Date()
                        .toISOString()
                        .split("T")[0];

                dateInput.min = today;


                /* =================================
                   PHONE - ONLY NUMBERS
                ================================= */

                const phoneInput =
                    document.getElementById(
                        "offerPhone"
                    );

                phoneInput.addEventListener(
                    "input",
                    function () {

                        this.value =
                            this.value
                                .replace(/\D/g, "")
                                .slice(0, 10);

                    }
                );


                /* =================================
                   OFFER BOOKING
                ================================= */

                const form =
                    document.getElementById(
                        "offerBookingForm"
                    );


                form.addEventListener(
                    "submit",
                    async function (e) {

                        e.preventDefault();


                        const name =
                            document.getElementById(
                                "offerNameInput"
                            ).value.trim();


                        const email =
                            document.getElementById(
                                "offerEmail"
                            ).value.trim();


                        const phone =
                            document.getElementById(
                                "offerPhone"
                            ).value.trim();


                        const bookingDate =
                            document.getElementById(
                                "offerDate"
                            ).value;


                        const bookingTime =
                            document.getElementById(
                                "offerTime"
                            ).value;


                        /* =================================
                           BASIC VALIDATION
                        ================================= */

                        if (!name) {

                            alert(
                                "Please enter your name."
                            );

                            return;

                        }


                        if (!email) {

                            alert(
                                "Please enter your email."
                            );

                            return;

                        }


                        if (!/^[0-9]{10}$/.test(phone)) {

                            alert(
                                "Please enter a valid 10-digit phone number."
                            );

                            return;

                        }


                        if (!bookingDate) {

                            alert(
                                "Please select an appointment date."
                            );

                            return;

                        }


                        if (!bookingTime) {

                            alert(
                                "Please select an appointment time."
                            );

                            return;

                        }


                        /* =================================
                           SUNDAY CHECK
                        ================================= */

                        const selectedDate =
                            new Date(
                                bookingDate + "T00:00:00"
                            );

                        const day =
                            selectedDate.getDay();


                        if (day === 0) {

                            alert(
                                "Sunday is closed. Please select another date."
                            );

                            return;

                        }


                        /* =================================
                           BOOKING DATA
                        ================================= */

                        const bookingData = {

                            name: name,

                            email: email,

                            phone: phone,

                            service:
                                selectedOffer ||
                                "Special Offer",

                            design:
                                "Offer Booking",

                            bookingDate:
                                bookingDate,

                            bookingTime:
                                bookingTime,

                            bookingType:
                                "OFFER"

                        };


                        console.log(
                            "Sending booking:",
                            bookingData
                        );


                        /* =================================
                           SEND TO SPRING BOOT
                        ================================= */

                        try {

                            const response =
                                await fetch(
                                    "http://localhost:8080/api/bookings",
                                    {

                                        method: "POST",

                                        headers: {

                                            "Content-Type":
                                                "application/json"

                                        },

                                        body:
                                            JSON.stringify(
                                                bookingData
                                            )

                                    }
                                );


                            /* =================================
                               SUCCESS
                            ================================= */

                            if (response.ok) {

                                alert(
                                    "Offer Appointment Booked Successfully! 💅✨"
                                );


                                form.reset();


                                window.location.href =
                                    "offer.html";

                            }


                            /* =================================
                               ERROR
                            ================================= */

                            else {

                                let errorMessage =
                                    "Booking failed. Please try again.";


                                try {

                                    const errorData =
                                        await response.json();


                                    if (errorData.message) {

                                        errorMessage =
                                            errorData.message;

                                    }

                                }

                                catch (error) {

                                    console.log(
                                        "No JSON error response."
                                    );

                                }


                                alert(
                                    errorMessage
                                );

                            }

                        }


                        /* =================================
                           SERVER CONNECTION ERROR
                        ================================= */

                        catch (error) {

                            console.error(
                                "Booking Error:",
                                error
                            );


                            alert(
                                "Unable to connect to the server. Please make sure your Spring Boot backend is running on port 8080."
                            );

                        }

                    }
                );

            }
        );

    </script>


</body>

</html>
